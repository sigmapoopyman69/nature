
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autumn connection test</title>
<style>
body {
  background: #17251d;
  color: #f5ead7;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
main {
  background: #26382b;
  padding: 28px;
  border-radius: 16px;
  width: min(85%, 420px);
  text-align: center;
}
button {
  background: #d87937;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 13px 20px;
  cursor: pointer;
}
#result {
  margin-top: 20px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<main>
<h1>🍂 autumn connection test</h1>
<p>testing the ticket endpoint</p>
<button id="test">test connection</button>
<div id="result">ready</div>
</main>

<script>
const button = document.getElementById("test");
const result = document.getElementById("result");

button.addEventListener("click", async () => {
  button.disabled = true;
  result.textContent = "connecting...";

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);

  try {
    const response = await fetch(
      "https://autumn.wisp.uno:14497/ticket",
      {
        method: "POST",
        signal: controller.signal,
        cache: "no-store"
      }
    );

    const body = await response.text();

    result.textContent =
      "HTTP STATUS: " + response.status +
      "\nRESPONSE: " + (body || "(empty response)");

    if (response.ok) {
      try {
        const data = JSON.parse(body);
        result.textContent =
          "SUCCESS! Ticket issued.\nExpires in: " +
          data.expires_in + " seconds.\nTicket hidden.";
      } catch {
        result.textContent += "\nResponse was not valid JSON.";
      }
    }
  } catch (error) {
    result.textContent =
      error.name === "AbortError"
        ? "TIMEOUT: backend did not respond within 12 seconds."
        : "FETCH ERROR: " + error.message;
  } finally {
    clearTimeout(timeout);
    button.disabled = false;
  }
});
</script>
</body>
</html>
