
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autumn backend test</title>
  <style>
    body {
      background: #17251d;
      color: #f5ead7;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      background: #26382b;
      padding: 28px;
      border-radius: 16px;
      width: min(85%, 420px);
      text-align: center;
    }
    button {
      background: #d87937;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 13px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍂 autumn backend test</h1>
    <p>check whether the backend can issue a connection ticket.</p>
    <button id="test">test connection</button>
    <div id="result">waiting for test...</div>
  </main>

  <script>
    const button = document.getElementById("test");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "connecting...";

      try {
        const response = await fetch(
          "https://autumn.wispbyte.app:14497/ticket",
          { method: "POST" }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        result.textContent =
          "SUCCESS! Autumn issued a temporary ticket.\n" +
          "Expiration: " + data.expires_in + " seconds.\n" +
          "The ticket itself has been hidden.";
      } catch (error) {
        result.textContent =
          "CONNECTION FAILED\n" + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
